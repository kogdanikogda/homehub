<style>

@font-face{font-family:'Manrope';font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/manrope-latin-wght-normal.woff2) format('woff2-variations');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@page{size:1920px 1080px;margin:0}
:root{--bg:#F7F3EE;--s1:#FFFFFF;--s2:#F1EBE3;--line:#E4DCD1;--tx:#1E1A16;--body:#3A342E;--mut:#6B635A;--ct:#9A6350;--c1:#DCBA9A;--c2:#C5957D;--ok:#4C614F;--warn:#6E6245;--bad:#6F4047;--info:#485E6E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg)}
body{font-family:'Manrope',system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit}

/* stage: one 1920×1080 slide, scaled to fit the window */
.viewport{position:fixed;inset:0;display:grid;place-items:center}
.stage{position:relative;width:1920px;height:1080px;flex:none;transform-origin:center center}
.deck{display:none}
html[lang=en] .deck[data-lang=en],html[lang=ru] .deck[data-lang=ru]{display:block}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;padding:84px 96px 72px;background:var(--bg);display:none}
.slide.on{display:block}

.eyebrow{font-size:20px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ct)}
h1{font-size:120px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--ct);margin-top:70px}
h2{font-size:52px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:18px;max-width:1500px}
h2.big{font-size:60px}
h3{font-size:28px;font-weight:700;letter-spacing:-.01em}
p,li{font-size:26px;line-height:1.45;color:var(--body)}
.mut{color:var(--mut)}
.lead{color:var(--tx);font-size:30px;line-height:1.45}
.row{display:flex}.col{display:flex;flex-direction:column}.between{justify-content:space-between;align-items:center}
.card{background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 1px 2px rgba(60,40,20,.06),0 8px 24px rgba(60,40,20,.05)}
.callout{margin-top:30px;display:flex;gap:28px;align-items:center;padding:26px 36px}
.callout p{color:var(--tx)}
.cap{font-size:20px;color:var(--mut);margin-top:14px;line-height:1.35}
.cap b{color:var(--tx);font-weight:700}
img{display:block;filter:drop-shadow(0 14px 30px rgba(50,35,20,.28))}
.num{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));color:#1a1210;font-weight:800;font-size:20px;flex:none}
.tag{display:inline-block;font-size:17px;font-weight:700;padding:6px 14px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}.tag.c{color:var(--ct)}
ul{list-style:none}
ul.dots li{position:relative;padding-left:30px;margin-top:14px}
ul.dots li:before{content:"";position:absolute;left:0;top:.62em;width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2))}
.arrow{font-size:56px;color:var(--ct);align-self:center}
.foot{position:absolute;left:96px;right:96px;bottom:36px;display:flex;justify-content:space-between;align-items:center;font-size:16px;color:#9A9288;letter-spacing:.04em}
.brand{display:flex;align-items:center;gap:10px}
.wm{position:absolute;pointer-events:none}
.wm img,.wm svg{filter:none}
.cover-l{position:absolute;left:96px;top:96px;width:760px;height:880px}
.cover .sub{font-size:38px;line-height:1.3;color:var(--tx);margin-top:28px;max-width:700px}
.meta{gap:48px;margin-top:auto;border-top:1px solid var(--line);padding-top:26px}
.meta-l{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.meta-v{font-size:20px;margin-top:8px}
.cover-img{position:absolute;left:900px;top:150px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.stat .n{font-size:88px;font-weight:800;line-height:1;color:var(--ct)}
.stat p{margin-top:8px}
.person{display:flex;align-items:center;gap:14px}
.person .num{width:44px;height:44px;font-size:19px}
.person span:last-child{font-size:19px;font-weight:700;color:var(--tx);white-space:nowrap}
.tile{flex:1;background:var(--s2);border-radius:16px;padding:20px 24px}
.swatch{flex:1;height:160px;border-radius:20px;background:var(--s1);border:1px solid var(--line);padding:24px}
.clay{height:200px;border-radius:24px;background:linear-gradient(135deg,#DCBA9A,#C5957D);padding:32px 36px;color:#1a1210}
.try{position:absolute;left:96px;bottom:90px;gap:10px}
.go{font-size:30px;font-weight:700;color:var(--ct);text-decoration:none}
.go:hover{text-decoration:underline;text-underline-offset:6px}

/* controls */
.bar{position:fixed;z-index:5;display:flex;align-items:center;gap:8px;padding:6px;border-radius:999px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 2px 12px rgba(60,40,20,.12)}
.bar button,.bar a{min-width:44px;height:44px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--tx);font:inherit;font-size:15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.bar button[aria-pressed=true]{background:var(--tx);color:#fff}
.bar button:disabled{opacity:.35;cursor:default}
.lang{top:16px;left:16px}
.links{top:16px;right:16px}
.nav{bottom:16px;left:50%;transform:translateX(-50%)}
.count{min-width:84px;text-align:center;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--mut)}
.bar svg{width:20px;height:20px}
body.idle .bar{opacity:0;transition:opacity .4s}
.bar{transition:opacity .2s}

@media print{
  html,body{overflow:visible;height:auto}
  .bar{display:none}
  .viewport{position:static;display:block}
  .stage{transform:none!important;width:auto;height:auto}
  .slide{position:relative;display:block!important;page-break-after:always;break-after:page}
}
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage">
<div class="deck" data-lang="en">
<!--SLIDES_EN-->
</div>
<div class="deck" data-lang="ru">
<!--SLIDES_RU-->
</div>
</div></div>

<div class="bar lang" role="group" aria-label="Language">
  <button type="button" data-lang="en" title="English">EN</button>
  <button type="button" data-lang="ru" title="Русский">RU</button>
</div>
<div class="bar links"><a id="proto" href="../">Prototype</a></div>
<div class="bar nav">
  <button type="button" id="prev" aria-label="Previous slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <span class="count" id="count">1 / @@COUNT@@</span>
  <button type="button" id="next" aria-label="Next slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
</div>

<script>
(function(){
  var KEY='homehub.lang'; // same key as the prototype, so both remember one language
  var total=@@COUNT@@, i=0;
  var L={en:{proto:'Prototype',prev:'Previous slide',next:'Next slide',lang:'Language',title:'HomeHub — case study'},
         ru:{proto:'Прототип',prev:'Предыдущий слайд',next:'Следующий слайд',lang:'Язык',title:'HomeHub — кейс'}};
  function getLang(){
    try{var q=new URLSearchParams(location.search).get('lang');if(q==='en'||q==='ru')return q;
        var s=localStorage.getItem(KEY);if(s==='en'||s==='ru')return s;}catch(e){}
    return 'en';
  }
  var lang=getLang();
  function setLang(l){
    lang=l;document.documentElement.lang=l;
    try{localStorage.setItem(KEY,l)}catch(e){}
    var u=new URL(location.href);u.searchParams.set('lang',l);history.replaceState(null,'',u);
    document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===l))});
    var t=L[l];document.title=t.title;
    var p=document.getElementById('proto');p.textContent=t.proto;p.href='../?lang='+l;
    document.getElementById('prev').setAttribute('aria-label',t.prev);
    document.getElementById('next').setAttribute('aria-label',t.next);
    document.querySelector('.lang').setAttribute('aria-label',t.lang);
    show(i);
  }
  function show(n){
    i=Math.max(0,Math.min(total-1,n));
    document.querySelectorAll('.slide.on').forEach(function(s){s.classList.remove('on')});
    var deck=document.querySelector('.deck[data-lang="'+lang+'"]');
    deck.children[i].classList.add('on');
    document.getElementById('count').textContent=(i+1)+' / '+total;
    document.getElementById('prev').disabled=i===0;
    document.getElementById('next').disabled=i===total-1;
    if(location.hash!=='#'+(i+1))history.replaceState(null,'',location.pathname+location.search+'#'+(i+1));
  }
  function fit(){
    var s=Math.min(innerWidth/1920,innerHeight/1080);
    document.getElementById('stage').style.transform='scale('+s+')';
  }
  document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){setLang(b.dataset.lang)})});
  document.getElementById('prev').addEventListener('click',function(){show(i-1)});
  document.getElementById('next').addEventListener('click',function(){show(i+1)});
  document.getElementById('stage').addEventListener('click',function(e){
    if(e.target.closest('a'))return;
    var r=this.getBoundingClientRect();show(e.clientX<r.left+r.width*.3?i-1:i+1);
  });
  addEventListener('keydown',function(e){
    if(e.altKey||e.ctrlKey||e.metaKey)return;
    var k=e.key;
    if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='Enter'){e.preventDefault();show(i+1)}
    else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault();show(i-1)}
    else if(k==='Home'){show(0)}else if(k==='End'){show(total-1)}
  });
  var x0=null;
  addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)show(dx<0?i+1:i-1);x0=null},{passive:true});
  var idle;function wake(){document.body.classList.remove('idle');clearTimeout(idle);idle=setTimeout(function(){document.body.classList.add('idle')},2500)}
  addEventListener('mousemove',wake);wake();
  addEventListener('resize',fit);fit();
  var h=parseInt(location.hash.slice(1),10);if(h>0)i=h-1;
  setLang(lang);
  addEventListener('hashchange',function(){var n=parseInt(location.hash.slice(1),10);if(n>0&&n-1!==i)show(n-1)});
})();
</script>
